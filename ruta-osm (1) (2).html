<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Optimizador de rutas · OpenStreetMap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b1f24;--mu:#667;--bd:#d9dde3;--ac:#2563eb}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.4 system-ui,sans-serif;color:var(--tx);background:var(--bg);display:grid;grid-template-columns:380px 1fr}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 60vh;height:auto}}
#p{overflow:auto;padding:12px;background:var(--sf);border-right:1px solid var(--bd);max-height:100vh}
#map{min-height:300px;height:100%}
h1{font-size:18px;margin:0 0 8px}h2{font-size:14px;margin:14px 0 6px}
textarea,select,input{width:100%;border:1px solid var(--bd);border-radius:6px;padding:6px;font:inherit;background:var(--bg);color:var(--tx)}
textarea{height:80px}button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:7px 11px;font:inherit;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.r{display:flex;gap:6px;margin-top:6px}.r>*{flex:1}.m{color:var(--mu);font-size:12px}
.i{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--bd);border-radius:6px;margin-bottom:3px;background:var(--bg);cursor:grab}
.i.o{border-color:var(--ac)}.i b{width:26px;text-align:right;color:var(--mu)}.i span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.i button{padding:1px 7px;background:transparent;color:var(--tx);border:1px solid var(--bd)}
.st{display:flex;gap:14px}.st b{font-size:20px;display:block}
.pin{background:#2563eb;color:#fff;border:2px solid #fff;border-radius:50%;font:bold 11px/18px system-ui;text-align:center;width:22px!important;height:22px!important;line-height:18px}
</style></head><body>
<div id="p">
<h1>🗺️ Optimizador de rutas</h1>
<p class="m">Haz clic en el mapa para añadir puntos, busca una dirección, o pega enlaces completos de Google Maps / líneas “nombre, lat, lng”.</p>
<div class="r"><input id="q" placeholder="Buscar dirección o lugar…" onkeydown="if(event.key==='Enter')search()"><button style="flex:0" onclick="search()">Añadir</button></div>
<textarea id="t" style="margin-top:6px"></textarea>
<div class="r"><button onclick="addTxt()">Añadir pegados</button><button class="s" onclick="clr()">Vaciar</button></div>
<p class="m" id="msg"></p>
<h2>Inicio y final</h2><div class="r"><select id="s" onchange="upd()"></select><select id="e" onchange="upd()"></select></div>
<div class="r"><button onclick="opt()">⚡ Calcular mejor ruta</button></div>
<h2>Resultado (por carretera)</h2><div class="st"><div><b id="n">0</b>puntos</div><div><b id="k2">–</b>km</div><div><b id="h">–</b>tiempo</div></div>
<h2>Orden (arrastra o ↑ ↓)</h2><div id="l"></div>
</div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const OSRM='https://router.project-osrm.org';
let P=[],id=0,D=0,mk=[],lines=[],tm;
const $=q=>document.getElementById(q),R=Math.PI/180;
const map=L.map('map').setView([37.24,-1.86],9);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const osmFr=L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'© OpenStreetMap contributors, HOT'});
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:17,attribution:'© OpenStreetMap contributors, SRTM | © OpenTopoMap'});
L.control.layers({'OpenStreetMap':osm,'OSM Humanitario':osmFr,'Topográfico':topo}).addTo(map);
let tileErr=0;osm.on('tileerror',()=>{if(++tileErr===5){map.removeLayer(osm);osmFr.addTo(map)}});
map.on('click',e=>{P.push({id:++id,name:'Punto '+id,lat:e.latlng.lat,lng:e.latlng.lng});sel();upd()});
const hv=(a,b)=>{const x=(b.lat-a.lat)*R,y=(b.lng-a.lng)*R,q=Math.sin(x/2)**2+Math.cos(a.lat*R)*Math.cos(b.lat*R)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))};
const co=c=>c.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
function parse(l){l=l.trim();if(!l)return null;let m,name='';
if(/^https?:/i.test(l)){const d=decodeURIComponent(l);
m=d.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||d.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||d.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)[, +]+(-?\d+\.\d+)/);
const p=d.match(/\/place\/([^\/@]+)/);if(p)name=p[1].replace(/\+/g,' ');return m?{name:name||'Punto',lat:+m[1],lng:+m[2]}:'bad'}
m=l.match(/^(.*?)[,;\s]*(-?\d+\.\d+)[,;\s]+(-?\d+\.\d+)\s*$/);return m?{name:m[1]||'Punto',lat:+m[2],lng:+m[3]}:'bad'}
function addTxt(){let ok=0,bad=0;$('t').value.split('\n').forEach(l=>{const r=parse(l);if(!r)return;if(r==='bad'){bad++;return}r.id=++id;P.push(r);ok++});
$('msg').textContent=ok+' añadidos'+(bad?'; '+bad+' sin coordenadas (los enlaces cortos goo.gl no valen)':'');$('t').value='';sel();upd(1)}
async function search(){const q=$('q').value.trim();if(!q)return;
try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))).json();
if(!r[0]){$('msg').textContent='Sin resultados';return}
P.push({id:++id,name:r[0].display_name.split(',').slice(0,2).join(','),lat:+r[0].lat,lng:+r[0].lon});$('q').value='';$('msg').textContent='';sel();upd();map.setView([r[0].lat,r[0].lon],13)}
catch(e){$('msg').textContent='Error de búsqueda'}}
function clr(){P=[];sel();upd()}
function sel(){const s=$('s').value,e=$('e').value,o=P.map((p,i)=>`<option value="${p.id}">${i+1}. ${p.name}</option>`).join('');
$('s').innerHTML=o;$('e').innerHTML='<option value="">Sin final fijo</option>'+o;
$('s').value=P.some(p=>p.id==s)?s:(P[0]?P[0].id:'');$('e').value=P.some(p=>p.id==e)?e:''}
async function opt(){if(P.length<3)return;const n=P.length;
let M=P.map(a=>P.map(b=>hv(a,b))),src='distancia en línea recta';
if(n<=100){try{$('msg').textContent='Calculando tiempos reales…';
const j=await(await fetch(OSRM+'/table/v1/driving/'+co(P)+'?annotations=duration')).json();
if(j.durations&&!j.durations.flat().includes(null)){M=j.durations.map((r,i)=>r.map((v,k)=>(v+j.durations[k][i])/2));src='tiempos reales por carretera'}}catch(e){}}
$('msg').textContent='Optimizado con '+src+(src[0]=='d'&&n>100?' (más de 100 puntos)':'')+'.';
const si=P.findIndex(p=>p.id==$('s').value),ei=$('e').value?P.findIndex(p=>p.id==$('e').value):-1;
if(si===ei){alert('Inicio y final deben ser distintos');return}
const left=new Set(P.map((_,i)=>i));left.delete(si);if(ei>=0)left.delete(ei);
let path=[si],c=si;while(left.size){let b=-1,bd=1e18;left.forEach(j=>{if(M[c][j]<bd){bd=M[c][j];b=j}});path.push(b);left.delete(b);c=b}
if(ei>=0)path.push(ei);const L2=path.length,last=ei>=0?L2-2:L2-1;let imp=true,it=0;
while(imp&&it++<200){imp=false;for(let i=1;i<=last-1;i++)for(let j=i+1;j<=last;j++){const a=path[i-1],b=path[i],c2=path[j],d=j+1<L2?path[j+1]:-1;
const dl=M[a][c2]+(d>=0?M[b][d]:0)-M[a][b]-(d>=0?M[c2][d]:0);if(dl<-1e-9){path.splice(i,j-i+1,...path.slice(i,j+1).reverse());imp=true}}}
const old=P.slice();P=path.map(i=>old[i]);sel();upd()}
function mv(i,j){if(j<0||j>=P.length)return;const [x]=P.splice(i,1);P.splice(j,0,x);sel();upd()}
function del(i){P.splice(i,1);sel();upd()}
function upd(fit){$('n').textContent=P.length;$('l').innerHTML='';
P.forEach((p,i)=>{const d=document.createElement('div');d.className='i';d.draggable=true;
d.innerHTML=`<b>${i+1}</b><span>${p.name}</span><button onclick="mv(${i},${i-1})">↑</button><button onclick="mv(${i},${i+1})">↓</button><button onclick="del(${i})">✕</button>`;
d.ondragstart=()=>D=i;d.ondragover=e=>{e.preventDefault();d.classList.add('o')};d.ondragleave=()=>d.classList.remove('o');d.ondrop=e=>{e.preventDefault();mv(D,i)};$('l').appendChild(d)});
mk.forEach(m=>m.remove());
mk=P.map((p,i)=>L.marker([p.lat,p.lng],{title:p.name,icon:L.divIcon({className:'pin',html:i+1,iconSize:[22,22]})}).addTo(map));
if(fit&&P.length)map.fitBounds(L.latLngBounds(P.map(p=>[p.lat,p.lng])).pad(.1));
clearTimeout(tm);tm=setTimeout(road,600)}
async function road(){lines.forEach(l=>l.remove());lines=[];
if(P.length<2){$('k2').textContent=$('h').textContent='–';return}
let km=0,sec=0,i=0;
try{while(i<P.length-1){const c=P.slice(i,i+25);
const j=await(await fetch(OSRM+'/route/v1/driving/'+co(c)+'?overview=full&geometries=geojson')).json();
if(!j.routes)throw new Error(j.message||j.code);const o=j.routes[0];km+=o.distance/1000;sec+=o.duration;
lines.push(L.polyline(o.geometry.coordinates.map(x=>[x[1],x[0]]),{color:'#2563eb',weight:4,opacity:.85}).addTo(map));i+=24}
$('k2').textContent=km.toFixed(1);$('h').textContent=Math.floor(sec/3600)+' h '+Math.round(sec%3600/60)+' min'}
catch(e){$('k2').textContent=$('h').textContent='error';$('msg').textContent='Ruta: '+e.message}}
sel();upd();
</script></body></html>
